name: Deploy to Contabo VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Contabo VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Starting GlamIQ deployment on Contabo VPS..."
            cd /var/www/glamiq

            echo "📦 Fetching latest changes from git..."
            git fetch origin main
            git reset --hard origin/main

            echo "🐍 Updating Python virtual environment and dependencies..."
            cd /var/www/glamiq/backend
            source venv/bin/activate
            pip install -r requirements.txt

            echo "🔄 Restarting FastAPI backend service..."
            sudo systemctl restart glamiq-backend

            echo "⚛️ Building frontend production bundle..."
            cd /var/www/glamiq/frontend
            npm ci
            npm run build

            echo "🌐 Reloading Nginx web server..."
            sudo systemctl reload nginx

            echo "✅ GlamIQ deployment completed successfully!"
